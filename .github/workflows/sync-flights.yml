# 운항 스케줄 주기 전체 동기화
# - 매일 11:00 KST: 한국공항공사(오늘부터 공개된 끝까지 날짜별 전 노선) → TAGO(노선별 스케줄 끝까지 날짜별)
# - Actions 탭에서 수동 실행 가능 (job 선택)
# 필요한 저장소 Secrets: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DATA_GO_KR_KEY
# 실행 결과는 Supabase sync_runs 테이블과 이 워크플로 로그에 남는다.
#
# 2026-09-27: 03:00 KST(0 18 * * *) → 11:00 KST(0 2 * * *)로 옮겼다.
#   2026-09-25 21:07 UTC(KST 06:07) 실행이 "apis.data.go.kr 연결 타임아웃"으로 TAGO 1,102회를 22분 동안
#   두드리다 30분 timeout에 걸려 cancelled로 끝났다. 같은 러너에서 02:47 UTC(KST 11:47) 수동 실행은 성공했다.
#   원인이 "해외 러너"인지 "그 시간대"인지 아직 모른다(표본이 각 1건). 그래서 호출량을 두 배로 늘리는 두 번째
#   cron 대신 관측된 성공 시간대(KST 11:00)로 옮겼다 — 쿼터(DATA_GO_KR_KEY는 운영 앱도 쓴다)를 늘리지 않고
#   같은 실험을 한다. 다음 실행도 실패하면 시간대 가설이 틀린 것이므로 국내 self-hosted runner나
#   Supabase Edge Function(서울)을 본다. 자세한 배경은 docs/CONTINGENCY.md.
name: sync-flights

on:
  schedule:
    - cron: '0 2 * * *'    # UTC 02:00 = KST 11:00
  workflow_dispatch:
    inputs:
      job:
        description: '실행할 동기화'
        type: choice
        options: [all, kac-full, tago-horizon]
        default: all

concurrency:
  group: sync-flights
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 이건 안전망일 뿐이다. 여기에 걸리면 GitHub이 job을 cancelled로 끝내고 sync_runs 행이 닫히지 않는다.
    # 스크립트가 45분에 스스로 멈춘다(lib/server/flight-sync.ts SYNC_DEADLINE_MS) — 그때는 실패로 남는다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 동기화
        run: npm run sync -- ${{ inputs.job || 'all' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}

      # 동기화가 실패해도 점검은 항상 돌린다. "실패했다"가 아니라 "지금 서비스가 어떤 상태인지"를 남긴다.
      # (2026-09-25: publishable 키로 1,084건이 RLS에 막힌 실행에서 그 사실이 로그 어디에도 요약되지 않았다)
      - name: 데이터 상태 점검
        if: always()
        continue-on-error: true
        run: npm run doctor
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
