# 테스트 전용 프로젝트의 데이터를 주 1회 채운다.
#   1) E2E가 쓸 운항 스케줄이 계속 있어야 한다 (sync가 7일 넘게 없으면 추천 검사가 빈손으로 돌아간다)
#   2) 테스트 프로젝트가 7일간 활동이 없어 pause 되는 것을 막는 heartbeat 역할도 한다
# 실행 시각은 운영 sync-flights(KST 11:00 매일)와 겹치지 않게 잡았다 — 같은 DATA_GO_KR_KEY를 쓴다.
# e2e.yml과 같은 concurrency 그룹이라 서로 기다린다(cancel-in-progress: false).
#
# 2026-09-27 첫 실행이 exit 2로 멈췄다. 원인이 둘이었고 둘 다 여기서 고쳤다.
#   1) 이 잡은 DEV_TEST_EMAIL·DEV_TEST_PASSWORD를 넘기지 않는데 `e2e:reset`은 둘 다 요구한다.
#      게이트는 DEV_TEST_PASSWORD만 보므로 "시크릿은 다 있다"인데도 잡이 실패했다.
#      → env에 두 값을 추가했다.
#   2) `e2e:reset`은 검사 날짜를 고르기 전에 **운항 스케줄이 있어야** 한다(없으면 중단한다).
#      그런데 sync보다 먼저 돌아서, 아직 비어 있는 테스트 프로젝트는 첫 실행이 영원히 성공할 수 없었다.
#      → 표식 확인(`e2e:check`, 자격증명·DB 데이터 불필요) → sync → 계정 초기화/날짜 → 시드 순으로 바꿨다.
#      표식 확인을 맨 앞에 두는 이유는 그대로다 — 운영 프로젝트에 sync가 흘러드는 것을 막는다.
name: e2e-data

on:
  schedule:
    - cron: '0 4 * * 0'    # UTC 일요일 04:00 = KST 일요일 13:00
  workflow_dispatch:

concurrency:
  group: e2e-db
  cancel-in-progress: false

jobs:
  # 테스트 프로젝트를 만들기 전(E2E_* 시크릿이 없을 때)에는 잡을 건너뛴다.
  # 조용히 넘어가지 않도록 경고 주석을 남긴다 — 나중에 시크릿을 지우면 여기서 드러난다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.E2E_SUPABASE_URL }}
          KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          PW: ${{ secrets.DEV_TEST_PASSWORD }}
          EMAIL: ${{ secrets.DEV_TEST_EMAIL }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$PW" ] || [ -z "$EMAIL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E 건너뜀::E2E_* 시크릿이 아직 없어 테스트 DB 동기화를 건너뜁니다 (docs/E2E.md 2장)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      # 운영 프로젝트 URL — 표식보다 먼저 대조한다. 같으면 즉시 중단한다 (운영 DB 보호)
      PROD_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # e2e:reset이 요구한다 (계정을 지우고 다시 만든다)
      DEV_TEST_EMAIL: ${{ secrets.DEV_TEST_EMAIL }}
      DEV_TEST_PASSWORD: ${{ secrets.DEV_TEST_PASSWORD }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 1) 이 프로젝트가 테스트 전용인지 먼저 증명한다 (운영 DB에 sync가 흘러드는 것을 막는다).
      #    표식만 보므로 DB가 비어 있어도 통과한다.
      - name: 테스트 DB 표식 확인
        run: npm run e2e:check
      # 2) 동기화 — 여기서 운항 스케줄이 채워져야 다음 단계가 날짜를 고를 수 있다
      - run: npm run sync -- kac-full
      - run: npm run sync -- tago-horizon
      # 3) 계정을 처음 상태로 되돌리고 검사 날짜를 고른다 (운항 스케줄이 있어야 성공한다)
      - name: 계정 초기화와 검사 날짜 고르기
        run: npm run e2e:reset
      # 4) E2E가 보는 접근 시간 고정값 (카카오 키 없이도 추천이 뜨게 한다 — docs/E2E.md)
      - name: E2E 고정 접근 시간 넣기
        run: npm run e2e:seed
      # 동기화 뒤 상태를 남긴다 (실패해도 게이트는 돈다 — sync-flights.yml과 같은 이유)
      - name: 데이터 상태 점검
        if: always()
        continue-on-error: true
        run: npm run doctor
