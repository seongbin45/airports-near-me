# 테스트 전용 프로젝트의 데이터를 주 1회 채운다.
#   1) E2E가 쓸 운항 스케줄이 계속 있어야 한다 (sync가 7일 넘게 없으면 추천 검사가 빈손으로 돌아간다)
#   2) 테스트 프로젝트가 7일간 활동이 없어 pause 되는 것을 막는 heartbeat 역할도 한다
# 실행 시각은 운영 sync-flights(KST 11:00 매일)와 겹치지 않게 잡았다 — 같은 DATA_GO_KR_KEY를 쓴다.
# e2e.yml과 같은 concurrency 그룹이라 서로 기다린다(cancel-in-progress: false).
name: e2e-data

on:
  schedule:
    - cron: '0 4 * * 0'    # UTC 일요일 04:00 = KST 일요일 13:00
  workflow_dispatch:

concurrency:
  group: e2e-db
  cancel-in-progress: false

jobs:
  # 테스트 프로젝트를 만들기 전(E2E_* 시크릿이 없을 때)에는 잡을 건너뛴다.
  # 조용히 넘어가지 않도록 경고 주석을 남긴다 — 나중에 시크릿을 지우면 여기서 드러난다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.E2E_SUPABASE_URL }}
          KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          PW: ${{ secrets.DEV_TEST_PASSWORD }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$PW" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E 건너뜀::E2E_* 시크릿이 아직 없어 테스트 DB 동기화를 건너뜁니다 (docs/E2E.md 2장)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 표식이 있는 프로젝트인지 먼저 확인한다 — 운영 프로젝트에 sync가 흘러드는 것을 막는다
      - name: 테스트 DB 준비와 표식 확인
        run: npm run e2e:reset
      - run: npm run sync -- kac-full
      - run: npm run sync -- tago-horizon
      # E2E 대화 흐름은 추천 카드를 확인한다 — 접근 시간이 없으면 계산할 수 없다(고정값을 넣는다)
      - run: npm run e2e:seed
      # 동기화 뒤 상태를 남긴다 (실패해도 게이트는 돈다 — sync-flights.yml과 같은 이유)
      - name: 데이터 상태 점검
        if: always()
        continue-on-error: true
        run: npm run doctor
